name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Tests
        run: PYTHONPATH=. pytest tests -q

      - name: Offline screen
        run: |
          {
            echo '## Screen (fixture data)'
            echo '```'
            PYTHONPATH=. python -m gscreen.cli screen --provider fixture
            echo '```'
            echo '## Grounding validator'
            echo '```'
            PYTHONPATH=. python tools/grounding_demo.py
            echo '```'
            echo '## Backtest'
            echo '```'
            PYTHONPATH=. python -m gscreen.cli backtest --provider fixture
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
