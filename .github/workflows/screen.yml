name: screen

# Runs the screen on a schedule and commits the result, so you can read it in
# the GitHub mobile app without a machine.
#
# Sources are chosen at run time. The default is `free`: static universe,
# Yahoo prices, EDGAR fundamentals - no paid key required. Note that Yahoo
# throttles shared cloud IPs hard, so some tickers will come back as
# [data] rejections on a CI runner. That is expected, not a bug.

on:
  schedule:
    - cron: "30 21 * * 1-5"   # 21:30 UTC weekdays, after the US close
  workflow_dispatch:
    inputs:
      preset:
        description: "Data sources"
        type: choice
        options: [free, free-stooq, free-yahoo, offline, paid, hybrid]
        default: free
      limit:
        description: "Max tickers to fetch (keep small on free sources)"
        type: string
        default: "10"
      use_llm:
        description: "Run the model stage and enforce grounding"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Cache fetched responses for the day. Reruns then cost no extra
      # requests, which matters most for Yahoo's throttling.
      - uses: actions/cache@v4
        with:
          path: _cache
          key: data-${{ github.run_id }}
          restore-keys: |
            data-

      - name: Resolve preset
        id: cfg
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: |
          PRESET="${{ inputs.preset || 'free' }}"
          if [ "$PRESET" = "free" ] && [ -z "$TIINGO_API_KEY" ]; then
            echo "::error::preset 'free' needs a TIINGO_API_KEY secret (free key at tiingo.com)."
            echo "::notice::Yahoo and Stooq are IP-blocked from GitHub runners, so there is no keyless option here."
            exit 1
          fi
          # paid/hybrid need a key; fall back rather than fail the schedule
          if [ "$PRESET" = "paid" ] || [ "$PRESET" = "hybrid" ]; then
            if [ -z "$EODHD_API_KEY" ]; then
              echo "::notice::No EODHD_API_KEY secret - falling back to the free preset."
              PRESET="free"
            fi
          fi
          echo "preset=$PRESET" >> "$GITHUB_OUTPUT"

      # Probe each source before the real run, so a failure names the source
      # and status instead of producing a wall of identical rejections.
      - name: Check sources
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || 'gscreen research script' }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: |
          {
            echo '## Source check'
            echo '```'
            PYTHONPATH=. python -m gscreen.cli doctor 2>&1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run screen
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # SEC asks for a contact address in the User-Agent.
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || 'gscreen research script' }}
        run: |
          set -o pipefail
          # Let the library resolve the trading day so the filename and the
          # screen's as_of cannot disagree.
          DATE=$(PYTHONPATH=. python -c "from gscreen.dates import resolve_as_of; print(resolve_as_of()[0])")
          echo "resolved trading day: $DATE"
          mkdir -p results
          LLM=""
          if [ "${{ inputs.use_llm }}" = "true" ] && [ -n "$ANTHROPIC_API_KEY" ]; then
            LLM="--llm"
          fi
          LIMIT="${{ inputs.limit || '10' }}"
          PYTHONPATH=. python -m gscreen.cli screen \
            --preset "${{ steps.cfg.outputs.preset }}" \
            --limit "$LIMIT" \
            --as-of "$DATE" $LLM | tee "results/$DATE.txt"
          {
            echo "## Screen $DATE (preset: ${{ steps.cfg.outputs.preset }})"
            echo '```'
            cat "results/$DATE.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          git diff --staged --quiet || git commit -m "screen: $(date -u +%F)"
          git push
